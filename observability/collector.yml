services:
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION-0.162.0}
    restart: unless-stopped
    user: "${OTEL_COLLECTOR_UID:-1000}:${OTEL_COLLECTOR_GID:-1000}"
    depends_on:
      - aspire-dashboard
    networks:
      - private
    environment:
      OTEL_TELEMETRY_MAX_MB: ${OTEL_TELEMETRY_MAX_MB:-100}
      OTEL_TELEMETRY_MAX_DAYS: ${OTEL_TELEMETRY_MAX_DAYS:-30}
      OTEL_TELEMETRY_MAX_BACKUPS: ${OTEL_TELEMETRY_MAX_BACKUPS:-20}
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - type: bind
        source: ./observability/collector/config.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OTEL_TELEMETRY_DIR:-./observability/telemetry}
        target: /telemetry
        bind:
          create_host_path: false

  aspire-dashboard:
    ports: !reset []
